<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json">
    <title>Dinosaurio Chrome V2</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }

      body {
        height: 100vh;
        background: #0b0c0a;
        display: flex;
        align-items: center;
      }

      .contenedor {
        width: 920px;
        height: 480px;
        margin: 0 auto;

        position: relative;

        background: linear-gradient(#b7d6c7, transparent) #ffe2d1; /*linear-gradient(#90ebff, white);*/
        transition: background-color 1s linear;
        overflow: hidden;
      }

      .mediodia {
        background-color: #ffdcf3;
      }

      .tarde {
        background-color: #ffadad;
      }

      .noche {
        background-color: #aca8c7;
      }

      .dino {
        width: 84px;
        height: 84px;

        position: absolute;
        bottom: 22px;
        left: 42px;
        z-index: 2;

        background: url(img/dino.png) repeat-x 0px 0px;
        background-size: 336px 84px;
        background-position-x: 0px;
      }

      .dino-corriendo {
        animation: animarDino 0.25s steps(2) infinite;
      }
      .dino-estrellado {
        background-position-x: -252px;
      }

      .dino-ducking {
        height: 50px; /* Reduced height for squashing effect */
        /* The dino's bottom is pinned by "bottom: 22px" from .dino class.
           Reducing height makes it appear to squash downwards. */
        /* We want to show the top part of the sprite, so background-position-y: 0px is fine. */
        background-position-x: -84px; /* Use one of the running frames, e.g., the first one. */
        animation: none; /* Stop the running animation */
      }

      .flying-obstacle {
        width: 46px; /* Using cactus1.png dimensions */
        height: 96px;
        background: url(img/cactus1.png) no-repeat;
        position: absolute;
        z-index: 1;
        /* style.bottom will be set by JS */
      }

      .suelo {
        width: 200%;
        height: 42px;

        position: absolute;
        bottom: 0;
        left: 0;

        background: url(img/suelo.png) repeat-x 0px 0px;
        background-size: 50% 42px;
      }

      .cactus {
        width: 46px;
        height: 96px;

        position: absolute;
        bottom: 16px;
        left: 600px;
        z-index: 1;

        background: url(img/cactus1.png) no-repeat;
      }
      .cactus2 {
        width: 98px;
        height: 66px;

        background: url(img/cactus2.png) no-repeat;
      }

      .nube {
        width: 92px;
        height: 26px;

        position: absolute;
        z-index: 0;

        background: url(img/nube.png) no-repeat;
        background-size: 92px 26px;
      }

      .score {
        width: 100px;
        height: 30px;

        position: absolute;
        top: 5px;
        right: 15px;
        z-index: 10;

        color: #d48871;
        font-family: Verdana;
        font-size: 30px;
        font-weight: bold;
        text-align: right;
      }

      .game-over {
        display: none;

        position: absolute;
        width: 100%;

        text-align: center;
        color: #7e928b;
        font-size: 30px;
        font-family: Verdana;
        font-weight: 700;
      }

      @keyframes animarDino {
        from {
          background-position-x: -84px;
        }
        to {
          background-position-x: -252px;
        }
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <div class="suelo"></div>

      <div class="dino dino-corriendo"></div>

      <div class="score">0</div>
      <div class="high-score">HI: 0</div>
      <div class="pause-message" style="display: none;">PAUSED</div>
    </div>

    <div class="game-over">
      <div class="game-over-text">GAME OVER</div>
      <div class="final-score-display">Score: 0</div>
      <div class="restart-prompt">Press Space or Touch to Restart</div>
    </div>

    <script src="script.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>
